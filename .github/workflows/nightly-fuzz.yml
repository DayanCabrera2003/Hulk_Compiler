name: Nightly Fuzz

on:
  schedule:
    - cron: '0 3 * * *' # Todos los días a las 03:00 UTC
  workflow_dispatch:

jobs:
  nightly-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run nightly fuzz
        run: |
          for target in lexer parser types banner codegen driver cli; do
            if [ -d "fuzz/fuzz_targets" ] && [ -f "fuzz/fuzz_targets/$target.rs" ]; then
              cargo fuzz run $target -- -max_total_time=600
            else
              echo "No existe fuzz target $target, saltando."
            fi
          done
