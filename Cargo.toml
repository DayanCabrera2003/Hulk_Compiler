[workspace]
members = [
    "crates/*"
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Equipo HULK <hulk@ejemplo.com>"]
repository = "https://github.com/tu-org/hulk-compiler"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
thiserror = "1.0"
codespan-reporting = "0.11"
clap = "4.5"
insta = "1.38"
proptest = "1.4"
inkwell = { version = "0.4.0", features = ["llvm17-0"] }
tracing = "0.1"
tracing-subscriber = "0.3"
